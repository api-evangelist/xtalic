description: 'Xtalic Corporation is a materials technology company founded in 2005
  out of MIT by professor Chris Schuh and Dr. Alan Lund, headquartered in Marlborough,
  Massachusetts, with technical support and sales teams in Shanghai, South China,
  and Singapore. Its patented computational materials design platform tailors
  nanostructured metal alloys - XTRONIC nickel, LUNA silver, XTALIUM aluminum,
  PALLEX palladium, XENERGY soft magnetic, and XEFORM nickel-gold - as
  high-performance, sustainable replacements for traditional metals and
  precious-metal plating in electronics connectors, EV powertrains and charging
  systems, wireless charging, and wearables. Xtalic publishes no public API or
  developer surface.'
